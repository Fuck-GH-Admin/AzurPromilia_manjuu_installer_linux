name: Yostar JP live download
on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/azurpromilia/**'
      - '.github/workflows/yostar-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/yostar-jp-preview-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/azp ./cmd/azurpromilia
      - name: Real official metadata and CDN CRC64 validation
        run: |
          /tmp/azp yostar --help
          /tmp/azp yostar probe --root "$RUNNER_TEMP/azupro-jp-probe"
