name: Official network and CDN probe

on:
  push:
    branches:
      - feature/downloader-reliability-20261125
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove outbound access to official hosts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'https://azurpromilia.jp/',
            'https://azurpromilia.jp/PCdownload',
            'https://api-grp.manjuu.com/',
            'https://api-grp-l2.manjuu.com/'
          )
          foreach ($target in $targets) {
            Write-Host "=== $target ==="
            curl.exe --silent --show-error --location --max-time 30 --output NUL --write-out "HTTP %{http_code} final=%{url_effective} remote=%{remote_ip}`n" $target
            if ($LASTEXITCODE -ne 0) { throw "Outbound request failed: $target" }
          }

      - name: Resolve current official Windows installer
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $page = 'pcdownload.bin'
          curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 90 --output $page 'https://azurpromilia.jp/PCdownload'
          if ($LASTEXITCODE -ne 0) { throw 'PCdownload request failed' }

          $bytes = [System.IO.File]::ReadAllBytes($page)
          $candidate = $null
          if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x4d -and $bytes[1] -eq 0x5a) {
            Move-Item $page original.exe
            $candidate = 'direct-response'
          } else {
            $html = [System.Text.Encoding]::UTF8.GetString($bytes)
            $matches = [regex]::Matches($html, 'https://[^"''<>\s]+\.exe(?:\?[^"''<>\s]*)?', 'IgnoreCase')
            $urls = @($matches | ForEach-Object { $_.Value.Replace('&amp;', '&') } | Select-Object -Unique)
            Write-Host "EXE candidates found: $($urls.Count)"
            foreach ($url in $urls) {
              try {
                Write-Host "Trying installer candidate host: $(([uri]$url).Host)"
                curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --output original.exe $url
                if ($LASTEXITCODE -ne 0) { continue }
                $head = [System.IO.File]::ReadAllBytes('original.exe')
                if ($head.Length -ge 2 -and $head[0] -eq 0x4d -and $head[1] -eq 0x5a) {
                  $candidate = $url
                  break
                }
              } catch {
                Write-Host $_
              }
            }
          }
          if (-not $candidate) {
            throw 'Official PCdownload was reachable, but no direct PE installer URL could be resolved from the response'
          }
          $hash = (Get-FileHash original.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item original.exe).Length
          Write-Host "Installer bytes=$size sha256=$hash"
          if ($hash -ne 'cf4b1f6233af2f2cb2d1c0de12f54d07606c3c84c829390b6caccfb2d0d1f04b') {
            throw "Official installer changed: sha256=$hash. Refusing to run bootstrap against an unreviewed binary."
          }

      - name: Fetch genuine package metadata
        shell: pwsh
        run: |
          python tools/bootstrap.py --installer original.exe --out packageconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'official metadata bootstrap failed' }

      - name: Build current downloader
        shell: pwsh
        run: |
          go build -trimpath -o azurpromilia.exe ./cmd/azurpromilia
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Probe REALITY package from official CDN
        shell: pwsh
        run: |
          .\azurpromilia.exe download --installer original.exe --packageconfig packageconfig.json --root probe-reality --probe --mode reality --workers 2
          if ($LASTEXITCODE -ne 0) { throw 'REALITY live probe failed' }

      - name: Probe SLICE package from official CDN
        shell: pwsh
        run: |
          .\azurpromilia.exe download --installer original.exe --packageconfig packageconfig.json --root probe-slice --probe --mode slice --workers 2
          if ($LASTEXITCODE -ne 0) { throw 'SLICE live probe failed' }

      - name: Keep only non-sensitive probe summary
        if: always()
        shell: pwsh
        run: |
          Remove-Item packageconfig.json -ErrorAction SilentlyContinue
          Remove-Item original.exe -ErrorAction SilentlyContinue
          Remove-Item pcdownload.bin -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force probe-reality,probe-slice -ErrorAction SilentlyContinue
          'Official outbound/CDN probe completed; inspect job log for HTTP status and downloader verification result.' | Set-Content probe-summary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-network-probe-summary
          path: probe-summary.txt
          retention-days: 7
