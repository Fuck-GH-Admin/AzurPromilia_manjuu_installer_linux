name: Linux build and test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m py_compile tools/bootstrap.py
      - run: node --check tools/fetch_packageconfig.cjs
      - run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/azurpromilia-linux-amd64 ./cmd/azurpromilia
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/azurpromilia-linux-arm64 ./cmd/azurpromilia
          cp -r tools dist/tools
          cp -r docs dist/docs
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          ./dist/azurpromilia-linux-amd64 help
          cd dist && sha256sum azurpromilia-linux-* > SHA256SUMS
          cd ..
          package="dist/package/azurpromilia-linux-amd64"
          mkdir -p "$package/docs" "$package/tools"
          cp dist/azurpromilia-linux-amd64 "$package/azurpromilia"
          ln -s azurpromilia "$package/azp"
          cp README.md "$package/README.md"
          cp LICENSE "$package/LICENSE"
          cp -r docs/. "$package/docs/"
          cp tools/bootstrap.py tools/fetch_packageconfig.cjs tools/steam-launch-options.example "$package/tools/"
          chmod 0755 "$package/azurpromilia"
          (cd "$package" && sha256sum azurpromilia azp > SHA256SUMS)
          tar -czf dist/azurpromilia-linux-amd64.tar.gz -C dist/package azurpromilia-linux-amd64
          (cd dist && sha256sum azurpromilia-linux-amd64.tar.gz > PACKAGE_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: azurpromilia-linux
          path: dist/
