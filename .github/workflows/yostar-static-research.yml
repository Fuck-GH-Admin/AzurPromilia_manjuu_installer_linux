name: Yostar installer static research

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and download current official Yostar installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 90 --output pcdownload.html 'https://azurpromilia.jp/PCdownload'
          if ($LASTEXITCODE -ne 0) { throw 'PCdownload request failed' }
          $html = Get-Content pcdownload.html -Raw
          $matches = [regex]::Matches($html, 'https://[^"''<>\s]+\.exe(?:\?[^"''<>\s]*)?', 'IgnoreCase')
          $urls = @($matches | ForEach-Object { $_.Value.Replace('&amp;', '&') } | Select-Object -Unique)
          $url = $urls | Where-Object { ([uri]$_).Host.ToLower() -eq 'launcher-pkg-azupro-jp.yo-star.com' } | Select-Object -First 1
          if (-not $url) { throw 'No allowlisted Yostar installer URL found on official PCdownload page' }
          curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --output yostar-installer.exe $url
          if ($LASTEXITCODE -ne 0) { throw 'installer download failed' }
          $hash = (Get-FileHash yostar-installer.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item yostar-installer.exe).Length
          "installer_host=$(([uri]$url).Host)" | Set-Content yostar-report.txt
          "size=$size" | Add-Content yostar-report.txt
          "sha256=$hash" | Add-Content yostar-report.txt

      - name: PE and marker inspection
        shell: pwsh
        run: |
          @'
          import hashlib, pathlib, re, struct

          p = pathlib.Path('yostar-installer.exe')
          b = p.read_bytes()
          report = []
          def add(x=''): report.append(str(x))

          add('')
          add('== PE STRUCTURE ==')
          if b[:2] != b'MZ':
              add('not_mz=true')
          else:
              pe = struct.unpack_from('<I', b, 0x3c)[0]
              add(f'pe_offset={pe}')
              if b[pe:pe+4] == b'PE\\0\\0':
                  machine, nsec, _, _, _, optsz, chars = struct.unpack_from('<HHIIIHH', b, pe+4)
                  add(f'machine=0x{machine:04x}')
                  add(f'sections={nsec}')
                  add(f'characteristics=0x{chars:04x}')
                  sec_off = pe + 24 + optsz
                  overlay = 0
                  for i in range(nsec):
                      off = sec_off + i*40
                      name = b[off:off+8].rstrip(b'\\0').decode('ascii','replace')
                      vsize, vaddr, rawsize, rawptr = struct.unpack_from('<IIII', b, off+8)
                      overlay = max(overlay, rawptr + rawsize)
                      add(f'section[{i}]={name} raw_offset={rawptr} raw_size={rawsize} virtual_size={vsize}')
                  add(f'overlay_offset={overlay}')
                  add(f'overlay_size={max(0, len(b)-overlay)}')
                  if overlay < len(b):
                      ov = b[overlay:overlay+32]
                      add('overlay_head_hex='+ov.hex())

          add('')
          add('== SIGNATURE OFFSETS ==')
          signatures = {
              'zip_local': b'PK\\x03\\x04',
              'zip_eocd': b'PK\\x05\\x06',
              '7z': b'7z\\xbc\\xaf\\x27\\x1c',
              'rar4': b'Rar!\\x1a\\x07\\x00',
              'rar5': b'Rar!\\x1a\\x07\\x01\\x00',
              'cab': b'MSCF',
              'nsis': b'Nullsoft',
              'inno': b'Inno Setup',
              'electron': b'Electron',
              'asar': b'app.asar',
          }
          for name, sig in signatures.items():
              hits=[]; start=0
              while len(hits)<20:
                  i=b.find(sig,start)
                  if i<0: break
                  hits.append(i); start=i+1
              add(f'{name}={hits}')

          add('')
          add('== MARKERS ==')
          markers = [
              'app.asar','resources\\app.asar','electron','Electron','napi-cutils','cutils.node',
              'api-grp.manjuu.com','api-grp-l2.manjuu.com','packageconfig','gameversion',
              'downloadMode','gamePackageList','cdnBaseUrls','launchEntry','pre/check',
              'manjuu','Manjuu','Yostar','YOSTAR','yo-star','AzurPromilia','bluepoch',
              'launcherId','channelCode','secretKey','SC000'
          ]
          for m in markers:
              a = b.find(m.encode('utf-8'))
              u = b.find(m.encode('utf-16le'))
              add(f'{m}: ascii={a} utf16le={u}')

          add('')
          add('== LONG URL HOSTS (sample) ==')
          urls = set()
          for m in re.finditer(rb'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]{8,300}', b):
              try:
                  u=m.group().decode('ascii','ignore').rstrip('.,;)>]')
                  urls.add(u)
              except Exception: pass
              if len(urls)>=80: break
          for u in sorted(urls): add(u)

          with open('yostar-report.txt','a',encoding='utf-8') as f:
              f.write('\\n'.join(report)+'\\n')
          '@ | Set-Content inspect.py
          python inspect.py

      - name: 7-Zip listing and extraction probe
        shell: pwsh
        run: |
          "`n== 7ZIP LISTING ==" | Add-Content yostar-report.txt
          7z l yostar-installer.exe | Out-File -Append -Encoding utf8 yostar-report.txt
          New-Item -ItemType Directory -Force extracted | Out-Null
          7z x -y -oextracted yostar-installer.exe | Out-File -Append -Encoding utf8 yostar-report.txt
          "`n== EXTRACTED TOP-LEVEL ==" | Add-Content yostar-report.txt
          Get-ChildItem extracted -Force | Select-Object Name,Length,Mode | Format-Table -AutoSize | Out-String | Add-Content yostar-report.txt
          "`n== EXTRACTED INTERESTING FILES ==" | Add-Content yostar-report.txt
          Get-ChildItem extracted -Recurse -Force -File | Where-Object { $_.Name -match '(?i)(asar|json|config|launcher|electron|dll|exe|pak|dat|7z|zip)$' -or $_.FullName -match '(?i)(resource|app\.asar|node_modules|launcher)' } | Select-Object -First 250 FullName,Length | Format-Table -AutoSize | Out-String -Width 300 | Add-Content yostar-report.txt

      - name: Upload static report only
        uses: actions/upload-artifact@v4
        with:
          name: yostar-installer-static-report
          path: yostar-report.txt
          retention-days: 7
