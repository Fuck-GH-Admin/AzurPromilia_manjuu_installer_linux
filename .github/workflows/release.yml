name: Publish Linux release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0-preview.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select and validate release tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          python3 -m py_compile tools/bootstrap.py
          node --check tools/fetch_packageconfig.cjs

      - name: Build and package Linux amd64 and arm64
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          archives=()
          for arch in amd64 arm64; do
            package="azurpromilia-${RELEASE_TAG}-linux-$arch"
            mkdir -p "dist/$package/docs" "dist/$package/tools"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/$package/azurpromilia" ./cmd/azurpromilia
            cp README.md LICENSE "dist/$package/"
            cp -r docs/. "dist/$package/docs/"
            cp tools/bootstrap.py tools/fetch_packageconfig.cjs tools/steam-launch-options.example "dist/$package/tools/"
            chmod 0755 "dist/$package/azurpromilia"
            (cd "dist/$package" && sha256sum azurpromilia > SHA256SUMS)
            tar -czf "dist/$package.tar.gz" -C dist "$package"
            archives+=("$package.tar.gz")
          done
          (
            cd dist
            sha256sum "${archives[@]}" > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: Azur Promilia Linux ${{ steps.meta.outputs.tag }}
          body: |
            Unofficial Linux CLI for the Manjuu / SC000 PC client.

            Includes Linux amd64 and arm64 packages and SHA256SUMS.

            Tested with SC000 1.0.0.30 in REALITY mode:
            - Automatic download of the official SC000 1.0.2.2 launcher and a live CDN resource probe passed.
            - Full install and 40,457-file MD5 verification passed.
            - Single-file repair and post-repair verification passed.
            - Manual Steam / Proton setup reached the game.

            The arm64 downloader passed the live CDN probe under QEMU with an imported package list. Automatic metadata bootstrap on arm64 requires a runtime that can execute the x86-64 Windows launcher.
            SLICE full installation and cross-version preload/update are pending.
            Licensed under PolyForm Noncommercial License 1.0.0. Commercial use is not permitted.
            Read docs/PLAYER_GUIDE.md and LICENSE in the archive before use.
            [Release validation report](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/docs/RELEASE_VALIDATION.md)
          files: |
            dist/azurpromilia-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz
            dist/azurpromilia-${{ steps.meta.outputs.tag }}-linux-arm64.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
