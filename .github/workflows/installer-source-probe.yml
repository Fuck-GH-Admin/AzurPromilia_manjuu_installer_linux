name: Probe official SC000 installer source

on:
  push:
    branches:
      - feature/builtin-installer-fallback-20261126
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Unit tests
        run: go test ./...
      - name: Inspect official website download metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import html, json, pathlib, re, urllib.parse, urllib.request

          base = "https://azurpromilia.manjuu.com/"
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"}

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  print("FETCH", r.status, len(data), r.geturl())
                  return data, r.geturl(), dict(r.headers)

          raw, final, headers = get(base)
          text = raw.decode("utf-8", "replace")
          pathlib.Path("probe/home.html").write_text(text, encoding="utf-8")

          urls = set()
          for m in re.findall(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', text, re.I):
              urls.add(urllib.parse.urljoin(final, html.unescape(m)))
          for m in re.findall(r'''https?://[^"'<>\s]+''', text, re.I):
              urls.add(html.unescape(m))

          scripts = [u for u in urls if re.search(r'\.js(?:\?|$)', u, re.I)]
          report = []
          report.append("HOME_FINAL=" + final)
          report.append("HOME_BYTES=" + str(len(raw)))
          report.append("SCRIPTS=" + str(len(scripts)))

          patterns = [
              rb'https?://[^"\'<>\s]+\.exe(?:\?[^"\'<>\s]*)?',
              rb'https?://[^"\'<>\s]+',
              rb'[^"\'<>\s]{0,180}SC000[^"\'<>\s]{0,180}',
              rb'[^"\'<>\s]{0,180}manjuu_installer[^"\'<>\s]{0,180}',
              rb'[^"\'<>\s]{0,180}(?:pcDownload|downloadPc|downloadPC|windows|launcher)[^"\'<>\s]{0,180}',
          ]

          def scan(label, blob):
              found = set()
              for p in patterns:
                  for m in re.finditer(p, blob, re.I):
                      v = m.group(0)
                      try:
                          s = v.decode("utf-8", "replace")
                      except Exception:
                          continue
                      if len(s) <= 500:
                          found.add(s)
              marker_contexts = []
              for marker in [b"nativeLauncherDownloadUrl", b"VITE_SSO_LAUNCHER_PATH", b"SC000", b"native-launcher", b"/activity/web/download/info", b"downloadUrls", b"grpAppId"]:
                  start = 0
                  while True:
                      pos = blob.find(marker, start)
                      if pos < 0:
                          break
                      lo = max(0, pos - 5000)
                      hi = min(len(blob), pos + len(marker) + 5000)
                      marker_contexts.append(blob[lo:hi].decode("utf-8", "replace"))
                      start = pos + len(marker)
                      if len(marker_contexts) >= 20:
                          break
              if found or marker_contexts:
                  report.append("\n## " + label)
                  report.extend(sorted(found))
                  for ctx in marker_contexts:
                      report.append("\n-- CONTEXT --\n" + ctx)

          scan("home", raw)

          for idx, url in enumerate(scripts):
              try:
                  blob, actual, _ = get(url)
              except Exception as exc:
                  report.append(f"FETCH_ERROR {url} {exc}")
                  continue
              pathlib.Path(f"probe/script-{idx}.js").write_bytes(blob)
              scan("script " + actual, blob)

          import hashlib, time

          api = "https://api-grp.manjuu.com/activity/web/download/info"
          ts = str(int(time.time() * 1000))
          query = "gameId=35"
          sign = hashlib.md5((ts + query).encode("utf-8")).hexdigest()
          req = urllib.request.Request(
              api + "?" + query,
              headers={
                  **ua,
                  "grp-app-id": "350010",
                  "grp-channel-code": "C000",
                  "grp-sub-channel-code": "SC000",
                  "device-id": "",
                  "timestamp": ts,
                  "sign": sign,
                  "Accept": "application/json",
                  "Origin": "https://azurpromilia.manjuu.com",
                  "Referer": "https://azurpromilia.manjuu.com/",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              api_raw = resp.read()
              report.append("\n## live download info API")
              report.append("HTTP=" + str(resp.status))
              report.append(api_raw.decode("utf-8", "replace"))
          payload = json.loads(api_raw)
          data = payload.get("data") or {}
          launcher = data.get("nativeLauncherDownloadUrl")
          if not launcher:
              raise RuntimeError("nativeLauncherDownloadUrl missing from official API")
          report.append("OFFICIAL_LAUNCHER_URL=" + launcher)

          installer_req = urllib.request.Request(launcher, headers=ua)
          h = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(installer_req, timeout=180) as resp:
              report.append("INSTALLER_FINAL_URL=" + resp.geturl())
              with open("probe/current-installer.exe", "wb") as f:
                  while True:
                      chunk = resp.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
                      h.update(chunk)
                      total += len(chunk)
          report.append("INSTALLER_BYTES=" + str(total))
          report.append("INSTALLER_SHA256=" + h.hexdigest())

          pathlib.Path("probe/report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY
      - name: Verify current official installer is compatible with automatic resolver
        shell: bash
        run: |
          set -euo pipefail
          url="$(grep '^OFFICIAL_LAUNCHER_URL=' probe/report.txt | tail -1 | cut -d= -f2-)"
          hash="$(grep '^INSTALLER_SHA256=' probe/report.txt | tail -1 | cut -d= -f2-)"
          size="$(grep '^INSTALLER_BYTES=' probe/report.txt | tail -1 | cut -d= -f2-)"
          cache="$HOME/.cache/azurpromilia/SC000"
          mkdir -p "$cache"
          cp probe/current-installer.exe "$cache/official-installer.exe"
          python3 - "$cache/official-installer.json" "$url" "$hash" "$size" <<'PY'
          import json, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "url": sys.argv[2],
              "sha256": sys.argv[3],
              "size": int(sys.argv[4]),
              "source": "integration-seed"
          }), encoding="utf-8")
          PY
          go build -o probe/azurpromilia ./cmd/azurpromilia
          echo '{"code":1,"msg":"expected integration stop"}' > probe/dummy-packageconfig.json
          set +e
          output="$(./probe/azurpromilia download --packageconfig probe/dummy-packageconfig.json --root probe/game 2>&1)"
          rc=$?
          set -e
          echo "$output"
          test "$rc" -ne 0
          grep -q 'INSTALLER cache hit' <<<"$output"
          grep -q 'official API error 1' <<<"$output"
      - uses: actions/upload-artifact@v4
        with:
          name: sc000-installer-source-probe
          path: probe/report.txt
          retention-days: 7
